# yaml-language-server: $schema=https://raw.githubusercontent.com/akshaybabloo/binstall/refs/heads/main/schema.json
name: "Zoxide"
description: "A fast and safe alternative to 'cd' for navigating your filesystem"
url: "https://github.com/ajeetdsouza/zoxide"
installLocation: "~/bin"
files:
  - fileName: "zoxide"
    checkVersion: true
    copyIt: true
    versionCommand:
      args: "--version"
      regexVersion: "\\d+\\.\\d+\\.\\d+"
download:
  linux:
    amd64:
      fileName: "zoxide-{{.Version}}-x86_64-unknown-linux-musl.tar.gz"