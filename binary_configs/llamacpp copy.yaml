# yaml-language-server: $schema=https://raw.githubusercontent.com/akshaybabloo/binstall/refs/heads/main/schema.json
name: "neovim"
description: "LLM inference in C/C++"
url: "https://github.com/neovim/neovim"
installLocation: "~/neovim"
download:
  linux:
    amd64:
      fileName: "nvim-linux-x86_64.tar.gz"
files:
  - fileName: "*"
    copyIt: true
    checkVersion: false

  - fileName: "nvim"
    copyIt: false
    checkVersion: true
    versionCommand:
      args: "--version"
      regexVersion: "\\d+\\.\\d+\\.\\d+"
settings:
  active: false
  deleteIfNotActive: true

